    <meta name="description" content="Aplikasi otomatisasi melamar pekerjaan cerdas: scan brosur loker, direktori lowongan multi-portal, AI cover letter & live code arena." />
    <meta property="og:title" content="LamarKerja AI" />
    <meta property="og:description" content="Aplikasi otomatisasi melamar pekerjaan cerdas: scan brosur loker, direktori lowongan multi-portal, AI cover letter & live code arena." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- PWA & Android Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07090E" />
    <style>
      html, body, #root { background: #07090E; margin: 0; min-height: 100vh; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LamarKerja AI" />

    <!-- Google Fonts: Inter & Plus Jakarta Sans (Super Clean & Legible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const hadController = Boolean(navigator.serviceWorker.controller);
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(err => {
            console.log('SW registration note:', err);
          });
        });
        if (hadController) {
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        }
      }
    </script>
  </body>
</html>
