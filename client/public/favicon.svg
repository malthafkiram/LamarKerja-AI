<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lk-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="lk-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="lk-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="lk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#lk-bg-grad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="6" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Growth Trajectory Node Line -->
  <g stroke="url(#lk-arrow-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#lk-glow)">
    <polyline points="150,380 210,340 260,360 350,260" fill="none" />
    <circle cx="150" cy="380" r="8" fill="#6366F1" stroke="#38BDF8" stroke-width="4" />
    <circle cx="210" cy="340" r="7" fill="#6366F1" stroke="#38BDF8" stroke-width="4" />
    <circle cx="260" cy="360" r="7" fill="#6366F1" stroke="#38BDF8" stroke-width="4" />
  </g>

  <!-- Upward Growth Arrow -->
  <g stroke="url(#lk-cyan-violet)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#lk-glow)">
    <line x1="290" y1="330" x2="360" y2="250" />
    <polyline points="325,248 360,250 362,285" fill="none" />
  </g>

  <!-- Flying Paper Plane (LamarKerja Emblem) -->
  <g fill="none" stroke="url(#lk-cyan-violet)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#lk-glow)">
    <!-- Plane Main Body -->
    <polygon points="120,240 370,140 240,320 205,255" fill="rgba(14, 165, 233, 0.12)" />
    <line x1="370" y1="140" x2="205" y2="255" />
    <polygon points="205,255 240,320 230,265" fill="rgba(99, 102, 241, 0.25)" />
  </g>

  <!-- AI Sparkle Neural Star at the tip of the plane -->
  <g transform="translate(370, 140)" filter="url(#lk-glow)">
    <!-- Outer Star Burst -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" stroke-dasharray="4,4" />
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
    <!-- Bright Core -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="14" fill="#38BDF8" opacity="0.5" />
  </g>
</svg>
