[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Run Node as PID 1 so Railway SIGTERM is not wrapped as `npm error command failed`.
startCommand = "node --import ./server/loadEnv.js ./server/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
